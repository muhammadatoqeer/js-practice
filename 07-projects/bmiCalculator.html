<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            background-color: #aeaeae;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 600;
            font-size: 2rem;
            color: #111;
            flex-direction: column;
        }

        .container {
            display: flex;
            align-items: space-between;
            justify-content: space-between;
            width: 800px;
        }

        input {
            width: 200px;
            height: 20px;
            margin: 30px;
        }

        .nav {
            padding: 10px 40px;
            background-color: transparent;
            border: 2px solid black;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            color: black;
            text-decoration: none;

        }
    </style>
</head>

<body>
    <header>
        <a href="/07-projects/colorSwitcher.html" class='nav'>Color Switcher</a>
        <a href="/07-projects/digitalclock.html" class='nav'>Digital Clock</a>
    </header>
    <h3>BMI Calculator</h3>
    <div class="container">
        <form action="">
            <label for="height">Height in cm</label>
            <input type="text" name='height' id='height'> <br>
            <label for="weight">Weight in KG</label>
            <input type="text" name='weight' id='weight'> <br>
            <input type="submit">
            <input type="reset">
            <div class="solution"></div>
            <div class="message"></div>
            <h3>BMI Weight guide</h3>
            <li>Underweight: less than 18</li>
            <li>Normal Range = 18.0 and 26.0</li>
            <li>Overweight: greater than 26</li>
        </form>

    </div>
</body>
<script>
    let form = document.querySelector('form')

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        let height = Number(document.querySelector('#height').value); //reasons for introducing these variables here is important to understand because we want the values available in the form at the time of pressing submit. not prior or after.
        let weight = Number(document.querySelector('#weight').value);
        let results = document.querySelector('.solution');
        let message = document.querySelector('.message');
        const bmi = (weight / ((height * height) / 10000)).toFixed(2);

        if (height === '' || height < 0 || isNaN(height)) {
            results.innerHTML = `Please give a valid height ${height}`;
        } else if (weight === '' || weight < 0 || isNaN(weight)) {
            results.innerHTML = `Please give a valid weight ${weight}`;
        } else {
            results.innerHTML = `<span>${bmi}</span>`;
        }

        if (bmi < 18) {
            message.innerHTML = `<span>You're underweight!</span>`
        } else if (bmi >= 18.0 && bmi <= 26.0) {
            message.innerHTML = `<span>You're just fine :)</span>`
        } else if (bmi > 26.0) {
            message.innerHTML = `<span>You're overweight :(</span>`
        }
    })
</script>

</html>
