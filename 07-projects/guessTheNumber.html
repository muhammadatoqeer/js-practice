        body {
            display: flex;

        .container {
            height: 50%;
            width: 80%;
            background-color: #aeaeae;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        input[type=submit] {
            background-color: black;
            padding: 10px 20px;
            color: white;
            cursor: pointer;
        }

        input[type=text] {
            height: 20px;
        }

        form {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
    </style>

<body>
    <h1>Number Guessing Game</h1>
    <div class="container">
        <span class="rules">Try and guess a number between 1 and 100</span>
        <span class="attempts">You have 10 attempts in total to guess the correct number</span>
        <form action="">
            <h2>Guess the Number</h2>
            <input type="text" id="input"> <br>
            <input type="submit" value="Submit"> <br>
            <span id="results"></span><br>
            <span id="prev-guesses"></span> <br>
            <span id="remaining-attempts"></span>
        </form>

    </div>

</body>
<script>
            let num = Math.floor(Math.random() * 100 + 1);
            let form = document.querySelector('form');
            let results = document.querySelector('#results');
            let prevGuesses = document.querySelector('#prev-guesses');
            let remAttempts = document.querySelector('#remaining-attempts');

            form.addEventListener('submit', function (e) {
            e.preventDefault();
            let guess = Number(document.getElementById('input').value);

            for (let index = 0; index < 10; index++) {
                if (guess === '' || guess < 0 || isNaN(guess)) {
                    results.innerHTML = `Please give a valid guess`;
                } else if (guess === num) {
                    results.innerHTML = `That's correct!`;
                } else if (guess > num) {
                    results.innerHTML = `${guess} is too high!`;
                    prevGuesses.innerHTML += `${guess},`;
                    remAttempts.innerHTML = `${10 - index}`;
                } else {
                    results.innerHTML = `${guess} is too low!`; prevGuesses.innerHTML += `${guess},`;
                    remAttempts.innerHTML = `${10 - index}`;
                }

                if (index === 9) {
                    break;
                }
            }

        })
