    // my final try

    let interval_ID = null;
    let timestamp = () => console.log(`${Date.now()}`);
    let starter = document.getElementById('start');
    let stopper = document.getElementById('stop');

    starter.addEventListener('click', function () {
        if (!interval_ID) {
            interval_ID = setInterval(timestamp, 1000);
        }
        
    })

    stopper.addEventListener('click', function () {
        if (interval_ID) {
            clearInterval(interval_ID);
            interval_ID = null;
        }
