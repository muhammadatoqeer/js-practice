<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Colors</title>
    <style>
        body {
            background-color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            flex-direction: column;
            height: 100vh;
        }
    </style>
</head>

<body>
    <h1>Press on the start button to randomly change the colors of the body</h1>
    <div class="buttons">
        <button id="start">Start</button>
        <button id="stop">Stop</button>
    </div>

</body>

<script>
            let intervalId = null; // To store the interval ID
            let starter = document.getElementById('start');
            let stopper = document.getElementById('stop');

            // Function to generate a random hex color and change the body's background color
            let changeColor = () => {
                let hex = '0123456789ABCDEF';
                let hexcode = '#';
                for (let index = 0; index < 6; index++) {
                    let rand = Math.floor(Math.random() * 16);
                    hexcode += hex[rand];
                }
                document.body.style.backgroundColor = hexcode;
            };

            // Start button functionality
            starter.addEventListener('click', function () {
                if (!intervalId) { /* Prevent multiple intervals from being created. The if (!intervalId) condition ensures that a new interval is only created if one isn't already running.
        Problem Without This Check: If you press the Start button multiple times without stopping, multiple intervals will be created. Each interval would independently call the changeColor function, leading to overlapping calls and unexpected behavior (e.g., multiple background color changes every second). */
                    intervalId = setInterval(changeColor, 1000);
                }
            });

            // Stop button functionality
            stopper.addEventListener('click', function () {
                if (intervalId) {
                    clearInterval(intervalId); // Stop the interval
                    intervalId = null; // Reset the interval ID
                }
            });
</script>

</html>
